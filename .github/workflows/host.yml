name: Host contracts
on:
  workflow_dispatch:
  push:
    paths-ignore: ['docs/**', 'README.md', 'STATUS.json']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned sources
        run: python3 tools/bootstrap.py --root "$RUNNER_TEMP/mgst-dependencies"
      - name: Configure
        run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DMGST_DEPS_ROOT="$RUNNER_TEMP/mgst-dependencies"
      - name: Build
        run: cmake --build build/host --target mgst --parallel 4
      - name: Host contracts
        run: ctest --test-dir build/host --output-on-failure
      - name: Install and consume outside checkout
        run: |
          cmake --install build/host --prefix "$RUNNER_TEMP/mgst-install"
          cmake -S "$RUNNER_TEMP/mgst-install/share/MeguvizShaderTools/examples/external_consumer" -B "$RUNNER_TEMP/Unicode 消费目录" -G Ninja -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/mgst-install"
          cmake --build "$RUNNER_TEMP/Unicode 消费目录" --target verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: host-linux-${{ matrix.config }}
          path: |
            build/host/host-evidence/
            build/host/Testing/Temporary/
          if-no-files-found: warn
